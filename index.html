<!doctype html>
<html lang="en" data-theme="light">

<head>
  <!-- ======================
      BASIC META
    ======================= -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ======================
      PRIMARY SEO
    ======================= -->
  <title>UfitGo Operator Portal | Manage Bookings, Packages & Payments</title>
  <meta name="description"
    content="UfitGo Operator Portal helps verified travel operators manage packages, bookings, payments, and customer activity securely in one dashboard." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="UfitGo" />

  <!-- ======================
      BRANDING
    ======================= -->
  <link rel="icon" type="image/svg+xml" href="/ufitgo-brand-mark.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <!-- ======================
      OPEN GRAPH (FACEBOOK, WHATSAPP)
    ======================= -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="UfitGo" />
  <meta property="og:title" content="UfitGo Operator Portal" />
  <meta property="og:description"
    content="A modern dashboard for travel operators to manage bookings, packages, payments, and verification." />
  <meta property="og:url" content="https://partner.ufitgo.ng" />
  <meta property="og:image" content="/og/ufitgo-operator.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- ======================
      TWITTER CARD
    ======================= -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="UfitGo Operator Portal" />
  <meta name="twitter:description"
    content="Manage travel bookings, packages, and payouts with the UfitGo Operator Portal." />
  <meta name="twitter:image" content="/og/ufitgo-operator.png" />

  <!-- ======================
      PERFORMANCE: FONTS
    ======================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
    rel="stylesheet" />

  <!-- ======================
      THEME COLOR (MOBILE BROWSER UI)
    ======================= -->
  <meta name="theme-color" content="#2563eb" />

  <!-- ======================
      SECURITY & TRUST
    ======================= -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
</head>

  <noscript>
    <strong>
      UfitGo Operator Portal requires JavaScript to function properly.
    </strong>
  </noscript>

  <div id="root"></div>

  <!-- Vite entry -->
  <script type="module" src="/src/main.jsx"></script>

</html>
